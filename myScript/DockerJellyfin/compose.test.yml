# Override SOLO per il test parallelo di migrazione (Fase 4).
# Uso: docker compose -f compose.yml -f compose.test.yml up -d
# Il Flatpak resta acceso su 8096, il container di prova usa 8097 con gli stessi volumi.
# '!override' sostituisce (non accoda) la lista ports del file base.
services:
  jellyfin:
    container_name: jellyfin-test
    ports: !override
      - "8097:8096"
    restart: "no"
