################################################################################
# moonfin-mpv.conf — configurazione DEDICATA a Moonfin (flatpak org.moonfin.linux)
# NON usare per mpv standalone / Jellyfin Desktop: restano su ~/.config/mpv/mpv.conf
#
# Regole Moonfin (legge riga per riga, non come mpv):
#  - NIENTE virgolette attorno ai valori
#  - NIENTE [profili]: verrebbero appiattiti e applicati sempre
#  - glsl-shaders= su UNA sola riga, separatore ":" su Linux, path assoluti
#  - Le modifiche si applicano al prossimo avvio di riproduzione
################################################################################

# Upscaling di alta qualita (equivale alla parte utile di profile=gpu-hq)
scale=ewa_lanczossharp
cscale=ewa_lanczossharp

# Ripristina il dithering (Moonfin parte con dither off -> banding sui gradienti scuri)
dither=yes

# Presentazione a intervalli naturali (aggancio FreeSync/VRR)
video-sync=audio

# Decode SOFTWARE: VRAM difettosa, hwdec HW = artefatti. Richiede "Opzioni non sicure" attive.
# Coerente col toggle interno Moonfin "Hardware decoding" = SPENTO.
hwdec=no

# Cache streaming ridotta rispetto al setup desktop (3G+3G = 6 GB prenotabili).
# Richiede "Opzioni non sicure" attive (demuxer-*). Alza pure a 3G se hai RAM libera.
demuxer-max-bytes=1G
demuxer-max-back-bytes=1G

# Catena Anime4K HQ (stesso ordine del setup desktop), path assoluti nella sottocartella locale
glsl-shaders=/home/lorenzo/.local/share/myScript/moonfin/shaders/Anime4K_Clamp_Highlights.glsl:/home/lorenzo/.local/share/myScript/moonfin/shaders/Anime4K_Restore_CNN_Soft_VL.glsl:/home/lorenzo/.local/share/myScript/moonfin/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:/home/lorenzo/.local/share/myScript/moonfin/shaders/Anime4K_AutoDownscalePre_x2.glsl:/home/lorenzo/.local/share/myScript/moonfin/shaders/Anime4K_AutoDownscalePre_x4.glsl:/home/lorenzo/.local/share/myScript/moonfin/shaders/Anime4K_Upscale_CNN_x2_M.glsl
