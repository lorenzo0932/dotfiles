################################################################################
# 1. IMPOSTAZIONI VIDEO & PRESTAZIONI (OTTIMIZZATE PER VRR + AMBILIGHT)
################################################################################

# Utilizziamo il motore di rendering moderno per la massima qualità
vo=gpu-next

# Forziamo le API Vulkan per gestire Anime4K e sfruttare la scheda AMD al meglio
gpu-api=vulkan

# Sfruttiamo XWayland tramite Vulkan. Questo è il "ponte" fondamentale che permette
# a GNOME di gestire contemporaneamente sia il VRR attivo sia la cattura dell'Ambilight
gpu-context=x11vk

# Profilo di alta qualità di base
profile=gpu-hq

# Manteniamo la decodifica hardware nativa dentro Vulkan
# hwdec=vulkan-copy DISABILITATO: VRAM RX 6700 difettosa, decode HW = artefatti
hwdec=no

# Sempre in primo piano
# ontop

################################################################################
# 2. SINCRONIZZAZIONE FRAME (FONDAMENTALE PER IL VRR)
################################################################################

# Diciamo a mpv di presentare i frame al loro intervallo naturale.
# Questo permette ai driver AMD FreeSync di agganciare dinamicamente i Hz del monitor.
video-sync=audio

# Coda di 3 swapchain images: assorbe i picchi di carico della GPU evitando
# che il monitor sganci il VRR durante i pan veloci
swapchain-depth=3

# Presentazione FIFO: ogni frame viene mostrato quando il monitor è pronto
vulkan-swap-mode=fifo

################################################################################
# 3. ALTRE IMPOSTAZIONI PERSONALI (GLOBALI - PRIMA DEI PROFILI CONDIZIONALI)
################################################################################

# Impostazioni audio e volume
volume=85

# Disabilita i bordi e la barra del titolo della finestra di X11
border=no

# Sottotitoli e margini
panscan=0.18
sub-use-margins=yes

# Cache ottimizzata per video locali e streaming
cache=yes
demuxer-max-bytes=3G
demuxer-max-back-bytes=3G
cache-pause=no

# Ricorda l'ultima posizione del video
save-position-on-quit

# Opzioni di scaling di alta qualità
scale=ewa_lanczossharp
cscale=ewa_lanczossharp

# Modalità B HQ (Anime4K caricata automaticamente all'avvio per TUTTI i video)
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Restore_CNN_Soft_VL.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_VL.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl"

# Opzioni yt-dlp per sottotitoli automatici
ytdl-raw-options=sub-langs="en,eng,en-US,it,ita",write-subs=,write-auto-subs=,sub-format=srt


################################################################################
# 4. PROFILI DI COMPENSAZIONE AUTOMATICI (ALLA FINE ASSOLUTA DEL FILE)
# Il monitor LG (40-75Hz) NON ha LFC nativo dei driver. 
# Moltiplichiamo i frame per rimanere stabilmente dentro la finestra 40-75Hz.
################################################################################

# PROFILO A: video 23.976/24 fps (film/anime) -> raddoppiati a 47.952Hz (2x esatto)
# Ci posizioniamo a 48Hz, ben protetti dal pavimento dei 40Hz e lontani dal soffitto di 75Hz.
[vrr-lfc-24]
profile-cond=p["container-fps"] < 25
profile-restore=copy
vf-add=fps=48/1.001:round=near

# PROFILO B: video 25 fps (PAL) -> raddoppiati a 50Hz (2x esatto)
[vrr-lfc-25]
profile-cond=p["container-fps"] >= 25 and p["container-fps"] < 27
profile-restore=copy
vf-add=fps=50:round=near

# PROFILO C: video 29.97/30 fps -> raddoppiati a 59.94Hz (2x esatto per 29.97)
[vrr-lfc-30]
profile-cond=p["container-fps"] >= 27 and p["container-fps"] < 35
profile-restore=copy
vf-add=fps=60/1.001:round=near